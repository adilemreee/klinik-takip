# Shared observability stack: one instance serves both staging and production.
#   docker compose -f docker-compose.observability.yml up -d
#
# Deployed to its own directory (/opt/klinik/observability/) with its own .env,
# so compose reads one file for both ${...} interpolation and container env.
#
# Nothing here is published to the internet. Every port binds to 127.0.0.1 and
# is reached over the VPN through nginx (see ../nginx/klinik-internal.conf.example).
#
# Requires the shared network to exist first:
#   docker network create --subnet 172.26.0.0/16 klinik-observability

name: klinik-observability

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-common: &common
  restart: unless-stopped
  logging: *default-logging
  networks: [observability]

services:
  prometheus:
    <<: *common
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      # The lifecycle and admin APIs (config reload, series deletion over HTTP)
      # are disabled by default and deliberately left that way. Prometheus
      # rejects '=false' on boolean flags, so they are omitted, not negated.
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:8127:9090"
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 768M}

  loki:
    <<: *common
    image: grafana/loki:3.3.2
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ../observability/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:8128:3100"
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 768M}

  grafana:
    <<: *common
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:8126}
    volumes:
      - ../observability/grafana:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:8126:3000"
    depends_on: [prometheus, loki]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 512M}

  # --- GlitchTip: self-hosted, Sentry-protocol error tracking -----------------
  # Stack traces from a clinical system can carry patient context. Sending them
  # to a third-party SaaS would export health data to a processor we have no
  # agreement with, so this runs on our own server (spec section 8, KVKK).

  glitchtip-postgres:
    <<: *common
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD}
    volumes:
      - glitchtip-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: {cpus: "0.3", memory: 384M}

  glitchtip-redis:
    <<: *common
    image: redis:7-alpine
    volumes:
      - glitchtip-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: {cpus: "0.2", memory: 192M}

  glitchtip-migrate:
    <<: *common
    image: glitchtip/glitchtip:latest
    restart: "no"
    command: ./manage.py migrate
    env_file: [.env]
    depends_on:
      glitchtip-postgres: {condition: service_healthy}

  glitchtip:
    <<: *common
    image: glitchtip/glitchtip:latest
    env_file: [.env]
    volumes:
      - glitchtip-uploads:/code/uploads
    ports:
      - "127.0.0.1:8129:8080"
    depends_on:
      glitchtip-migrate: {condition: service_completed_successfully}
      glitchtip-redis: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 640M}

  glitchtip-worker:
    <<: *common
    image: glitchtip/glitchtip:latest
    command: bin/run-celery-with-beat.sh
    env_file: [.env]
    volumes:
      - glitchtip-uploads:/code/uploads
    depends_on:
      glitchtip-migrate: {condition: service_completed_successfully}
      glitchtip-redis: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 640M}

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
  glitchtip-db:
  glitchtip-redis:
  glitchtip-uploads:

networks:
  observability:
    external: true
    name: klinik-observability
