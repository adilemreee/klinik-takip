# Local development dependencies only — never deployed.
#
#   docker compose -f infra/compose/docker-compose.dev.yml up -d
#
# Ports are deliberately unusual so they cannot collide with anything already
# running on a developer machine.

name: klinik-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: klinik
      POSTGRES_PASSWORD: klinik
      POSTGRES_DB: klinik
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - devdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klinik"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass devpass
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a devpass ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: devaccess
      MINIO_ROOT_PASSWORD: devsecret123
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - devminio:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Creates the private buckets the file service expects, then exits.
  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 devaccess devsecret123
        mc mb --ignore-existing local/klinik-documents
        mc mb --ignore-existing local/klinik-photos
        mc anonymous set none local/klinik-documents
        mc anonymous set none local/klinik-photos

volumes:
  devdata:
  devminio:
