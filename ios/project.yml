# The app target, generated rather than committed.
#
# An .xcodeproj is a large generated file that conflicts on every branch and
# tells a reader nothing. This says the same thing in thirty lines, and
# `xcodegen generate` rebuilds the project from it — so what is reviewed is
# this, and what is built is derived from it.
name: Klinik
options:
  bundleIdPrefix: adilemre.klinik
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Klinik:
    path: .

targets:
  Klinik:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      # Drawn by design/scripts/generate-icon.py rather than pasted in, so the
      # one binary in the bundle is still something a reader can regenerate
      # and a reviewer can diff the source of.
      - path: App/Resources/Assets.xcassets
    dependencies:
      - package: Klinik
        product: KlinikApp
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Klinik
        # Turkish is the base language (spec section 7). Without these two the
        # app declares itself English-only, iOS never even asks for Turkish,
        # and a Turkish clinic opens an English app — with the tr.lproj sitting
        # unused inside the very bundle it just ignored.
        CFBundleDevelopmentRegion: tr
        CFBundleLocalizations:
          - tr
          - en
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "4"
        # Declared here so every upload does not stop to ask. The app uses TLS
        # and the platform's own Keychain and Data Protection, and implements
        # no cryptography of its own — which is exactly the exemption in
        # category 5, part 2 of the US export regulations.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # Stated rather than inherited. xcodegen's default is these three, and
        # a default is not a decision: what the app is allowed to do with the
        # screen should be written down where somebody can argue with it.
        #
        # Portrait and both landscapes. Landscape earns its place on two
        # screens — the lab table, which is a table, and the photograph viewer,
        # where a wound is not always taller than it is wide. Upside-down is
        # left out: a phone held upside-down puts the earpiece at the bottom,
        # and nothing here is worth that.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Resolved from Config/Base.xcconfig, which includes an untracked
        # Local.xcconfig. This repository is public, so the clinic's hostnames
        # are not in it; a build that was never told where to talk points at a
        # reserved name that never resolves, and fails visibly rather than
        # guessing.
        KlinikAPIBaseURL: $(KLINIK_API_BASE_URL)
        # The clinic app asks for these; each string is what the person is
        # actually being asked for, not a generic sentence.
        NSCameraUsageDescription: Yara ve kontrol fotoğraflarını çekmek için kameraya erişilir.
        NSPhotoLibraryUsageDescription: Var olan bir fotoğrafı klinikle paylaşmak için galeriye erişilir.
        NSMicrophoneUsageDescription: Sesli mesaj göndermek için mikrofona erişilir.
        NSFaceIDUsageDescription: Uygulamayı güvenli şekilde açmak için kullanılır.
        NSLocationWhenInUseUsageDescription: Acil durum bildirimine konumunuzu eklemek için kullanılır. Konum beklenmez; alarm hemen gider.
        # Read-only, and only kilo and nabız — the two readings the clinic
        # charts. Asking for more than a product uses is how an app is refused
        # at review and distrusted by whoever reads the prompt.
        NSHealthShareUsageDescription: Kilo ve nabız ölçümlerinizi Apple Health'ten alıp klinik takibinize eklemek için kullanılır. Yalnız siz istediğinizde okunur.
        NSHealthUpdateUsageDescription: Uygulama Apple Health'e veri yazmaz.
        # Development builds are pointed at a tunnel on localhost; a release
        # build talks to the clinic's own host over TLS and nothing else.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    # Capabilities the app asks the system for. Kept here rather than in a
    # committed .entitlements file for the same reason the project is generated:
    # what is reviewed should be the thirty lines, not the plist.
    #
    # A build signed without a matching provisioning profile will fail at that
    # step rather than silently shipping without the capability — which is the
    # right failure, because push that quietly does not register is push nobody
    # notices is missing.
    entitlements:
      path: App/Klinik.entitlements
      properties:
        # Resolved per configuration, below — but only as a default. This is
        # one of the entitlements the provisioning profile owns:
        # `ProcessProductPackaging` takes `aps-environment` from the profile,
        # so a Release archive signed with a development profile carries
        # `development` however this is set. What decides the push environment
        # is which profile signs the build — a development profile registers a
        # token the production APNs gateway will not deliver to, and push that
        # quietly does not arrive is the worst way to find that out. So check
        # the archive, not this line:
        #   codesign -d --entitlements :- Klinik.app
        aps-environment: $(KLINIK_APS_ENVIRONMENT)
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        # iPhone only.
        #
        # The app declared iPad as well, which App Store Connect refuses
        # unless the bundle also allows all four orientations — iPad
        # multitasking may resize a window to any of them, so an app that
        # forbids one cannot be a Split View tenant.
        #
        # Allowing all four would have satisfied the check and shipped an
        # iPad layout nobody has ever looked at: every screen here was drawn
        # and reviewed on a phone, and a clinical record laid out for a
        # 6-inch column stretched across 13 inches is not a considered iPad
        # app, it is a phone app on a big screen. Apple reviews on iPad when
        # you claim iPad.
        #
        # So: claim what has been looked at. iPad goes back in when somebody
        # has opened it there — one character, and the four orientations
        # above.
        TARGETED_DEVICE_FAMILY: "1"
        # The identifier the app is registered under. Spelled out because
        # `bundleIdPrefix` would derive `adilemre.klinik.Klinik`, and the app
        # on App Store Connect is `adilemre.klinik` — so the identifier that
        # ships was being corrected by hand in Xcode after every generate.
        PRODUCT_BUNDLE_IDENTIFIER: adilemre.klinik
        # Resolved from the untracked Config/Local.xcconfig, like the host is.
        # Without it every archive begins by setting a team in Xcode by hand,
        # and a setting nobody records is a setting that drifts.
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          KLINIK_APS_ENVIRONMENT: development
        Release:
          KLINIK_APS_ENVIRONMENT: production

# The scheme is written here rather than left to Xcode.
#
# It was not, and the build that reached TestFlight carried
# `aps-environment: development` and `get-task-allow: true` — the marks of an
# archive built in Debug. Nothing in the repository said otherwise: with no
# shared scheme, Xcode makes one per machine and its Archive action is whatever
# that machine last had selected. What ships was a local setting.
#
# Pinned here, an archive is a Release archive wherever it is built: production
# push, optimised, and no debugger entitlement.
schemes:
  Klinik:
    build:
      targets:
        Klinik: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
