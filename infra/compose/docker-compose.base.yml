# Base stack. Never used alone — always combined with an environment overlay:
#   docker compose -f docker-compose.base.yml -f docker-compose.production.yml up -d
#
# Rules enforced here (see docs/PORTS.md):
#   - postgres and redis expose NO host port; they are reachable only on the
#     internal docker network. This DB holds special-category health data.
#   - every published port binds to 127.0.0.1; the host nginx is the only
#     public entry point.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-common: &common
  restart: unless-stopped
  logging: *default-logging
  networks: [internal]

services:
  postgres:
    <<: *common
    # pgvector image ships PostgreSQL 16 + vector; pgcrypto and pg_trgm come
    # from contrib, already present in the base postgres image.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Deterministic collation so index behaviour matches across environments.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    <<: *common
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  minio:
    <<: *common
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:${MINIO_API_PORT}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT}:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # One-shot: create the private buckets the API expects and make sure neither
  # is anonymously readable. Runs to completion and exits (spec section 8:
  # files are reachable only through short-lived signed URLs).
  minio-init:
    image: minio/mc:latest
    restart: "no"
    networks: [internal]
    logging: *default-logging
    env_file: [.env]
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local "$${S3_ENDPOINT}" "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}"
        mc mb --ignore-existing "local/$${S3_BUCKET_DOCUMENTS}"
        mc mb --ignore-existing "local/$${S3_BUCKET_PHOTOS}"
        mc anonymous set none "local/$${S3_BUCKET_DOCUMENTS}"
        mc anonymous set none "local/$${S3_BUCKET_PHOTOS}"
        echo "buckets ready"

  api:
    <<: *common
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: klinik-api:${IMAGE_TAG:-local}
    env_file: [.env]
    environment:
      # Port INSIDE the container. API_PORT in .env is the host-side mapping
      # below and is deliberately not what the process binds to.
      PORT: 3000
    ports:
      - "127.0.0.1:${API_PORT}:3000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    <<: *common
    # Same image as the API, different entrypoint. Heavy work (OCR, AI, PDF,
    # notifications) never runs inside an HTTP request — see spec section 4.
    image: klinik-api:${IMAGE_TAG:-local}
    command: ["node", "dist/worker.js"]
    env_file: [.env]
    environment:
      PORT: 3000
    depends_on:
      api: {condition: service_started}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET}
