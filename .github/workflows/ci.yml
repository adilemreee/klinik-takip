name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same branch — this repo shares a small runner budget.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # A real PostgreSQL with pgvector. The guarantees that matter most here —
    # the append-only audit log, the trigram and vector indexes, the role
    # matrix — live in the database and cannot be proven against a mock.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: klinik
          POSTGRES_PASSWORD: klinik
          POSTGRES_DB: klinik_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U klinik"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://klinik:klinik@localhost:5432/klinik_test?schema=public
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_PASSWORD: ci-redis-password
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_ACCESS_KEY: ciaccess
      S3_SECRET_KEY: cisecret123
      S3_BUCKET_DOCUMENTS: klinik-documents
      S3_BUCKET_PHOTOS: klinik-photos
      S3_SIGNED_URL_TTL_SECONDS: 300

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Started as a step rather than a service container so it can require a
      # password: the application refuses to connect to an unauthenticated
      # Redis, and weakening that for CI would stop testing what ships.
      - name: Start Redis
        run: |
          docker run -d --name ci-redis -p 6379:6379 redis:7-alpine \
            redis-server --requirepass ci-redis-password
          for i in $(seq 1 20); do
            docker exec ci-redis redis-cli -a ci-redis-password ping >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "Redis did not become ready" >&2
          exit 1

      # Object storage, started the same way as Redis and for the same reason:
      # service containers cannot take a command, and MinIO needs one.
      - name: Start MinIO
        run: |
          docker run -d --name ci-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=ciaccess -e MINIO_ROOT_PASSWORD=cisecret123 \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1 && break
            sleep 1
          done
          docker run --rm --network host --entrypoint sh minio/mc:latest -c '
            mc alias set ci http://127.0.0.1:9000 ciaccess cisecret123
            mc mb --ignore-existing ci/klinik-documents
            mc mb --ignore-existing ci/klinik-photos
            mc anonymous set none ci/klinik-documents
            mc anonymous set none ci/klinik-photos
          '

      - name: Install dependencies
        run: npm ci

      # The Prisma client is a generated artefact; without it the type checker
      # cannot resolve @prisma/client.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:cov

      # Applies every migration from scratch on an empty database, which is
      # also the only routine check that the migration history still works.
      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed the permission matrix
        run: npm run seed

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      # The entry points moved once already when tsconfig include changed.
      # Assert the emitted layout instead of trusting it.
      - name: Verify build output layout
        run: test -f dist/main.js && test -f dist/worker.js

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage
          path: backend/coverage/
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Builds only — nothing is pushed to a registry from CI.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: klinik-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image runs as a non-root user
        run: |
          user=$(docker run --rm --entrypoint sh klinik-api:ci -c 'id -un')
          echo "image user: $user"
          [ "$user" = "node" ]

  security:
    name: Security — secrets and dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # gitleaks scans history, not just the tip

      # This repository is public and the project handles health data. A leaked
      # key must fail the build, not be discovered later.
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Audit dependencies
        working-directory: backend
        run: npm audit --audit-level=high
